<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Primary SEO Meta Tags -->
    <title>Portfolio | Full Stack MERN Developer & Designer</title>
    <meta name="title" content="Portfolio | Full Stack MERN Developer & Designer" />
    <meta name="description" content="Portfolio of a Full Stack MERN Developer specializing in high-performance web applications, modern UI/UX design, and cloud architectures." />
    <meta name="keywords" content="MERN Stack, React Developer, Node.js, Express, MongoDB, Full Stack Engineer, Portfolio, TailwindCSS" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Enforce Dark Mode -->
    <script>
      try {
        localStorage.setItem('portfolio_theme', 'dark');
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light');
      } catch (e) {}
    </script>
  </head>
  <body class="bg-nebula-950 text-slate-100 font-sans antialiased selection:bg-aurora-cyan/20 selection:text-aurora-cyan">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
